<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4338ca">
    <meta name="description" content="Evaluation official schedule and subject manager">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>Evaluation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="relative bg-indigo-600 p-2.5 rounded-xl shadow-inner border border-indigo-500" role="img" aria-label="Person teaching from an open book">
                    <i class="fa-solid fa-book-open text-xl text-indigo-100"></i>
                    <i class="fa-solid fa-person-chalkboard absolute -top-1 -right-1 text-xs text-amber-300"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Evaluation</h1>
                    <p class="text-xs sm:text-sm text-indigo-200">Official Schedule</p>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex flex-wrap items-center gap-2.5">
                <span id="syncStatus" class="bg-indigo-800 text-indigo-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud text-emerald-400"></i> Connecting Cloud...
                </span>
                <button onclick="openSubjectModal()" class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-book-medical"></i> Add Subject
                </button>
                <button onclick="openAddModal()" class="bg-white text-indigo-700 hover:bg-indigo-50 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Schedule
                </button>
                <button onclick="resetData()" class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5" title="Reset to Default">
                    <i class="fa-solid fa-rotate-right"></i> Reset Default
                </button>
                <button onclick="exportData()" class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5" title="Export JSON">
                    <i class="fa-solid fa-download"></i> Export
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- Schedule Filters -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <label class="relative sm:col-span-2 lg:col-span-1">
                <span class="sr-only">Search schedules by name</span>
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="search" id="searchInput" oninput="filterData()" placeholder="Search by name..." class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </label>
            <label>
                <span class="sr-only">Filter by subject</span>
                <select id="subjectFilter" onchange="filterData()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">All subjects</option>
                </select>
            </label>
            <label>
                <span class="sr-only">Filter from date</span>
                <input type="date" id="filterFrom" onchange="filterData()" aria-label="From date" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </label>
            <label>
                <span class="sr-only">Filter to date</span>
                <input type="date" id="filterTo" onchange="filterData()" aria-label="To date" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </label>
            <div class="flex items-center justify-between gap-3">
                <span id="recordCount" class="text-xs sm:text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg whitespace-nowrap">Loading schedules...</span>
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button onclick="switchView('table')" id="tableViewBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-700 shadow-sm" aria-label="Table view"><i class="fa-solid fa-table"></i></button>
                    <button onclick="switchView('card')" id="cardViewBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600" aria-label="Card view"><i class="fa-solid fa-id-card"></i></button>
                </div>
            </div>
        </div>

        <!-- Desktop / Tablet Table View Container -->
        <div id="tableViewContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div class="overflow-x-auto max-h-[680px]">
                <table class="w-full text-left border-collapse min-w-[720px]">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-bold tracking-wider sticky top-0 z-20 border-b border-slate-200 shadow-sm">
                        <tr>
                            <th class="py-3.5 px-4 bg-slate-100 border-r border-slate-200">Name</th>
                            <th class="py-3.5 px-4 bg-slate-100 border-r border-slate-200">From</th>
                            <th class="py-3.5 px-4 bg-slate-100 border-r border-slate-200">To</th>
                            <th class="py-3.5 px-4 bg-slate-100 border-r border-slate-200">Subjects</th>
                            <th class="py-3.5 px-3 bg-slate-100 text-center w-20">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Dynamically populated from Firestore -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Mobile / Card View Container -->
        <div id="cardViewContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamically populated from Firestore -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden bg-white rounded-2xl border border-slate-200 p-12 text-center flex flex-col items-center justify-center gap-3">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-700">No schedules found</h3>
            <p class="text-sm text-slate-500 max-w-sm">No records match your search or filter criteria.</p>
            <button onclick="clearFilters()" class="mt-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
                Clear Filters
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        <p>Powered by Evaluation • <a href="https://eva.sni.org.in/" class="text-indigo-600 hover:text-indigo-800 underline" target="_blank" rel="noopener noreferrer">Official Website</a></p>
    </footer>

    <!-- Add / Edit Modal -->
    <div id="scheduleModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-lg w-full max-h-[90vh] overflow-y-auto transform transition-all">
            <div class="bg-indigo-700 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold">Add Schedule</h3>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="scheduleForm" onsubmit="saveSchedule(event)" class="p-6 space-y-4">
                <input type="hidden" id="editDocId">
                
                <div>
                    <label for="modalName" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Name</label>
                    <input type="text" id="modalName" required maxlength="100" placeholder="Enter a name" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="modalDateFrom" class="block text-xs font-semibold text-slate-700 uppercase mb-1">From date</label>
                        <input type="date" id="modalDateFrom" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="modalDateTo" class="block text-xs font-semibold text-slate-700 uppercase mb-1">To date</label>
                        <input type="date" id="modalDateTo" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="subjectSelect" class="block text-xs font-semibold text-slate-700 uppercase">Select subjects</label>
                        <button type="button" onclick="openSubjectModal()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800"><i class="fa-solid fa-plus"></i> New subject</button>
                    </div>
                    <div class="flex gap-2">
                        <select id="subjectSelect" class="min-w-0 flex-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Choose a subject</option>
                        </select>
                        <button type="button" onclick="addSelectedSubject()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-semibold rounded-xl transition"><i class="fa-solid fa-plus"></i> Add</button>
                    </div>
                    <div id="selectedSubjects" class="flex flex-wrap gap-2 mt-3" aria-live="polite"></div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">
                        Save Schedule
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="subjectModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full overflow-hidden">
            <div class="bg-indigo-700 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-bold">Add Subject</h3>
                <button type="button" onclick="closeSubjectModal()" class="text-indigo-200 hover:text-white text-lg" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveSubject(event)" class="p-6 space-y-4">
                <div>
                    <label for="newSubjectName" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Subject name</label>
                    <input type="text" id="newSubjectName" required maxlength="150" placeholder="Enter a new subject" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeSubjectModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl">Add Subject</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMsg">Action completed successfully</span>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase handles
        let db, auth, userId;
        let scheduleData = [];
        let subjectData = [];
        let selectedSubjects = [];
        let appId;
        let useLocalStorage = false;
        let currentView = 'table';
        const scheduleStorageKey = 'schedule-manager-schedules';
        const subjectStorageKey = 'schedule-manager-subjects';
        const catalogSubjects = [
            "1-1 పాపక్షమాపణ యొక్క రహస్యము మరియు క్రీస్తు అన్ సాంగ్ హోంగ్ గారు",
            "1-2 ప్రతి యుగములో రక్షకుడు మరియు క్రొత్త పేరు",
            "1-3 జీవ వృక్ష ఫలము మరియు క్రీస్తు అన్ సాంగ్ హోంగ్ గారు",
            "1-4 యెరూషలేము తల్లి",
            "1-5 పరలోక కుటుంబము మరియు భూలోక కుటుంబము",
            "1-6 విశ్రాంతిదినమును పరిశుద్ధముగా ఆచరించండి",
            "1-7 నిత్యజీవమునకు మార్గమైన పస్కా",
            "1-8 సిలువ ఆరాధన విగ్రహారాధన",
            "1-9 వెంటనే బాప్తిస్మము పొందండి",
            "1-10 పరిశుద్ధ గ్రంథము సత్యము",
            "2-1 పరిశుద్ధ గ్రంథం ఎవరి గురించి సాక్ష్యం ఇస్తుంది?",
            "2-2 దావీదు రాజు క్రీస్తు అన్ సాంగ్ హోంగ్ గారు",
            "2-3 సీయోను నిర్మించిన దేవుడు",
            "2-4 పరలోకపు పెండ్లి విందు",
            "2-5 అబ్రాహాము యొక్క కుటుంబ చరిత్ర",
            "2-6 దానియేలు 2, 7 యొక్క ప్రవచనము",
            "2-7 ప్రకటన 13 యొక్క ప్రవచనము",
            "2-8 ప్రకటన 17,18 యొక్క ప్రవచనము",
            "2-9 దశమభాగము యొక్క నియమము",
            "2-10 ఆశ్రయంపురము మరియు భూమి",
            "3-1 త్రియేక దేవుడు",
            "3-2 మెల్కీసెదెకు యొక్క క్రమము",
            "3-3 జీవజలములకు ఊటయైన తల్లి",
            "3-4 గురుగులు మరియు గోధుములు",
            "3-5 దేవుడు తన స్వరక్తముతో సంపాదించిన సంఘము",
            "3-6 సువార్త అనగా ఏమిటి?",
            "3-7 నేను తప్ప వేరొక దేవుడు నీకు ఉండకూడదు",
            "3-8 దేవుని యొక్క ముద్ర వేసే కార్యము",
            "3-9 జీవగ్రంధము",
            "3-10 ఆత్మ ఉన్నది",
            "4-1 దావీదు యొక్క వేరు చిగురు చేత స్థాపించబడిన సంఘము",
            "4-2 కడపటి ఆదాము మరియు క్రీస్తు అన్ సాంగ్ హోంగ్ గారు",
            "4-3 పరిశుద్ధగ్రంథం ఒక ప్రవచన గ్రంథం",

            "4-5 పస్కా యొక్క నిజమైన అర్ధము",
            "4-6 మోషే యొక్క ధర్మశాస్త్రము మరియు క్రీస్తు యొక్క ధర్మ శాస్త్రము",
            "4-7 మోషే మరియు యేసు (సిలువ యొక్క అర్ధము)",
            "4-8 అబద్ధ ప్రవక్తలు ఎవరు?",
            "4-9 దశమ భాగము చేయడం ద్వారా ఆశీర్వాదములు",
            "4-10 ఆహారము గురించి",
            "5-1 దేవుని యొక్క వాక్యములు పరిపూర్ణమైనవి",
            "5-2 నాకు వేరుగా ఉండి మీరేమియు చేయలేరు",
            "5-3 దేవుని యొక్క ఆజ్ఞలు మరియు మనుషుల యొక్క పద్ధతులు",
            "5-4 అబద్ధ ప్రవక్తలను గూర్చి జాగ్రత్తపడుడి",
            "5-5 దేవుని యొక్క పరిపాలన మరియు అపవాది యొక్క పరిపాలన",
            "5-6 జీవపు నియమము మరియు మరణపు నియమము",
            "5-7 రెండవ రాకడ మరియు అంతిమ తీర్పు",
            "5-8 మేఘారూఢుడై వచ్చుట",
            "5-9 అంజూరపు చెట్టు యొక్క ఉపమానము",
            "5-10 తూర్పు నుండి దేవుని రాకడ",

            { id: "42", category: "PBC", name: "Titus", mon: "1-9 వెంటనే బాప్తిస్మము పొందండి", tue: "1-8 సిలువ ఆరాధన విగ్రహారాధన", wed: "1-7 నిత్యజీవమునకు మార్గమైన పస్కా", thu: "1-6 విశ్రాంతిదినమును పరిశుద్ధముగా ఆచరించండి", fri: "1-1 పాపక్షమాపణ యొక్క రహస్యము మరియు క్రీస్తు ఆన్ సాంగ్ హోంగ్ గారు" }
        ];

        // Initialize Firebase
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                appId = typeof __app_id !== 'undefined' ? __app_id : 'weekly-schedule-2026';
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Auth
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid || crypto.randomUUID();

                document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-cloud text-emerald-400"></i> Cloud Synced';

                // Realtime Firestore Listener
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
                const subjectRef = collection(db, 'artifacts', appId, 'public', 'data', 'subjects');

                subjectData = [...new Set(defaultData.flatMap(item => ['mon', 'tue', 'wed', 'thu', 'fri']
                    .map(day => item[day])
                    .filter(Boolean)))];
                updateSubjectOptions();

                onSnapshot(subjectRef, (snapshot) => {
                    subjectData = [...new Set([
                        ...subjectData,
                        ...snapshot.docs.map(subjectDoc => subjectDoc.data().name).filter(name => typeof name === 'string' && name.trim())
                    ])];
                    updateSubjectOptions();
                }, (error) => {
                    console.error("Subject sync error:", error);
                    showToast('Error loading subjects from cloud', 'error');
                });
                
                onSnapshot(colRef, async (snapshot) => {
                    if (snapshot.empty) {
                        // Seed default data if empty
                        for (const item of defaultData) {
                            await setDoc(doc(colRef, item.id), item);
                        }
                    } else {
                        scheduleData = [];
                        snapshot.forEach(docSnap => {
                            scheduleData.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        scheduleData.sort((a, b) => {
                            const first = normalizeSchedule(a);
                            const second = normalizeSchedule(b);
                            return first.dateFrom.localeCompare(second.dateFrom) || first.name.localeCompare(second.name);
                        });
                        renderSchedule();
                    }
                }, (error) => {
                    console.error("Firestore error:", error);
                    document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline Mode';
                    useLocalStorage = true;
                    loadLocalData();
                });

            } catch (e) {
                console.error("Initialization fallback:", e);
                document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Local Storage';
                useLocalStorage = true;
                loadLocalData();
            }
        });

        function getDefaultSubjects() {
            return [...new Set([
                ...catalogSubjects,
                ...defaultData.flatMap(item => ['mon', 'tue', 'wed', 'thu', 'fri']
                    .map(day => item[day])
                    .filter(Boolean))
            ])];
        }

        function loadLocalData() {
            try {
                const savedSchedules = localStorage.getItem(scheduleStorageKey);
                const savedSubjects = localStorage.getItem(subjectStorageKey);
                scheduleData = savedSchedules === null ? defaultData : JSON.parse(savedSchedules);
                const customSubjects = savedSubjects === null ? [] : JSON.parse(savedSubjects);
                if (!Array.isArray(scheduleData) || !Array.isArray(customSubjects)) {
                    throw new Error('Saved schedule data must be arrays');
                }
                subjectData = [...new Set([
                    ...getDefaultSubjects(),
                    ...customSubjects
                ])];
            } catch (error) {
                console.error("Local data load error:", error);
                scheduleData = defaultData;
                subjectData = getDefaultSubjects();
            }
            renderSchedule();
        }

        function saveLocalSchedules() {
            localStorage.setItem(scheduleStorageKey, JSON.stringify(scheduleData));
        }

        function getSlotBadge(val) {
            if (!val || val.trim() === '') return '';
            let bg = 'bg-slate-100 text-slate-700 border-slate-200';
            if (val.includes('పాపక్షమాపణ')) bg = 'bg-amber-50 text-amber-800 border-amber-200';
            else if (val.includes('ప్రతీ')) bg = 'bg-emerald-50 text-emerald-800 border-emerald-200';
            else if (val.includes('జీవ')) bg = 'bg-sky-50 text-sky-800 border-sky-200';
            else if (val.includes('యెరూషలేము')) bg = 'bg-purple-50 text-purple-800 border-purple-200';
            else if (val.includes('సిలువ') || val.includes('నిత్యజీవమునకు')) bg = 'bg-rose-50 text-rose-800 border-rose-200';
            
            return `<span class="inline-block px-2.5 py-1 rounded-lg text-xs font-medium border ${bg} shadow-2xs">${escapeHtml(val)}</span>`;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function normalizeSchedule(item) {
            const legacySubjects = ['mon', 'tue', 'wed', 'thu', 'fri'].map(day => item[day]).filter(Boolean);
            return {
                ...item,
                name: typeof item.name === 'string' ? item.name : '',
                dateFrom: item.dateFrom || '2026-11-09',
                dateTo: item.dateTo || '2026-11-13',
                subjects: Array.isArray(item.subjects)
                    ? [...new Set(item.subjects.filter(subject => typeof subject === 'string' && subject.trim()).map(subject => subject.trim()))]
                    : [...new Set(legacySubjects)]
            };
        }

        function formatDate(date) {
            if (!date) return '—';
            const parsedDate = new Date(`${date}T00:00:00`);
            return Number.isNaN(parsedDate.getTime()) ? '—' : new Intl.DateTimeFormat(undefined, { dateStyle: 'medium' }).format(parsedDate);
        }

        function updateSubjectOptions() {
            const allSubjects = [...new Set([
                ...catalogSubjects,
                ...subjectData,
                ...scheduleData.flatMap(item => normalizeSchedule(item).subjects)
            ])].sort((a, b) => a.localeCompare(b));
            const filter = document.getElementById('subjectFilter');
            const select = document.getElementById('subjectSelect');
            if (!filter || !select) return;
            const currentFilter = filter.value;
            const currentSelection = select.value;
            filter.innerHTML = '<option value="">All subjects</option>' + allSubjects.map(subject =>
                `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`
            ).join('');
            select.innerHTML = '<option value="">Choose a subject</option>' + allSubjects.map(subject =>
                `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`
            ).join('');
            filter.value = allSubjects.includes(currentFilter) ? currentFilter : '';
            select.value = allSubjects.includes(currentSelection) ? currentSelection : '';
        }

        window.filterData = function() {
            renderSchedule();
        }

        window.clearFilters = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('subjectFilter').value = '';
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value = '';
            renderSchedule();
        }

        function renderSchedule() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const subject = document.getElementById('subjectFilter').value;
            const filterFrom = document.getElementById('filterFrom').value;
            const filterTo = document.getElementById('filterTo').value;

            const filtered = scheduleData.map(normalizeSchedule).filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesSubject = subject === '' || item.subjects.includes(subject);
                const matchesFrom = filterFrom === '' || item.dateTo >= filterFrom;
                const matchesTo = filterTo === '' || item.dateFrom <= filterTo;
                return matchesSearch && matchesSubject && matchesFrom && matchesTo;
            });

            document.getElementById('recordCount').innerText = `Showing ${filtered.length} of ${scheduleData.length}`;

            const tbody = document.getElementById('tableBody');
            const cardContainer = document.getElementById('cardViewContainer');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                cardContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            let tableHtml = '';
            let cardHtml = '';

            filtered.forEach(item => {
                const subjectBadges = item.subjects.map(getSlotBadge).join(' ');
                tableHtml += `
                    <tr class="hover:bg-slate-50/80 transition group">
                        <td class="py-3 px-4 border-r border-slate-200 font-semibold text-slate-800">${escapeHtml(item.name)}</td>
                        <td class="py-3 px-4 border-r border-slate-200 text-sm">${formatDate(item.dateFrom)}</td>
                        <td class="py-3 px-4 border-r border-slate-200 text-sm">${formatDate(item.dateTo)}</td>
                        <td class="py-3 px-4 border-r border-slate-200"><div class="flex flex-wrap gap-1.5">${subjectBadges || '<span class="text-slate-400 text-xs">No subjects</span>'}</div></td>
                        <td class="py-3 px-2 text-center">
                            <div class="flex items-center justify-center gap-1 opacity-80 group-hover:opacity-100 transition">
                                <button data-action="edit" data-id="${escapeHtml(item.id)}" class="p-1.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Edit">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button data-action="delete" data-id="${escapeHtml(item.id)}" class="p-1.5 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Delete">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;

                cardHtml += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between gap-4 hover:shadow-md transition">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="text-base font-bold text-slate-900">${escapeHtml(item.name)}</h3>
                            <div class="flex items-center gap-1">
                                <button data-action="edit" data-id="${escapeHtml(item.id)}" class="p-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 rounded-lg transition text-xs" title="Edit">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button data-action="delete" data-id="${escapeHtml(item.id)}" class="p-2 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 rounded-lg transition text-xs" title="Delete">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="text-sm space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p><span class="font-semibold text-slate-500">From:</span> ${formatDate(item.dateFrom)}</p>
                            <p><span class="font-semibold text-slate-500">To:</span> ${formatDate(item.dateTo)}</p>
                            <div class="flex flex-wrap gap-1.5 pt-1">${subjectBadges || '<span class="text-slate-400 text-xs">No subjects</span>'}</div>
                        </div>
                    </div>
                `;
            });

            tbody.innerHTML = tableHtml;
            cardContainer.innerHTML = cardHtml;
            updateSubjectOptions();
            [tbody, cardContainer].forEach(container => {
                container.onclick = event => {
                    const button = event.target.closest('button[data-action]');
                    if (!button) return;
                    if (button.dataset.action === 'edit') window.openEditModal(button.dataset.id);
                    if (button.dataset.action === 'delete') window.deleteRecord(button.dataset.id);
                };
            });
        }

        window.switchView = function(view) {
            currentView = view;
            const tableContainer = document.getElementById('tableViewContainer');
            const cardContainer = document.getElementById('cardViewContainer');
            const tableBtn = document.getElementById('tableViewBtn');
            const cardBtn = document.getElementById('cardViewBtn');

            if (view === 'table') {
                tableContainer.classList.remove('hidden');
                cardContainer.classList.add('hidden');
                tableBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-white text-indigo-700 shadow-sm flex items-center gap-1.5";
                cardBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
            } else {
                tableContainer.classList.add('hidden');
                cardContainer.classList.remove('hidden');
                cardBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-white text-indigo-700 shadow-sm flex items-center gap-1.5";
                tableBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
            }
        }

        window.openAddModal = function() {
            document.getElementById('modalTitle').innerText = 'Add Schedule';
            document.getElementById('editDocId').value = '';
            document.getElementById('modalName').value = '';
            document.getElementById('modalDateFrom').value = '';
            document.getElementById('modalDateTo').value = '';
            selectedSubjects = [];
            renderSelectedSubjects();
            document.getElementById('scheduleModal').classList.remove('hidden');
        }

        window.openEditModal = function(id) {
            const record = scheduleData.find(item => item.id === id);
            if (!record) return;
            const schedule = normalizeSchedule(record);

            document.getElementById('modalTitle').innerText = `Edit Schedule: ${schedule.name}`;
            document.getElementById('editDocId').value = record.id;
            document.getElementById('modalName').value = schedule.name;
            document.getElementById('modalDateFrom').value = schedule.dateFrom;
            document.getElementById('modalDateTo').value = schedule.dateTo;
            selectedSubjects = [...schedule.subjects];
            renderSelectedSubjects();
            document.getElementById('scheduleModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('scheduleModal').classList.add('hidden');
        }

        window.addSelectedSubject = function() {
            const subjectSelect = document.getElementById('subjectSelect');
            const subject = subjectSelect.value;
            if (!subject) {
                showToast('Choose a subject first', 'error');
                return;
            }
            if (selectedSubjects.includes(subject)) {
                showToast('Subject is already added', 'error');
                return;
            }
            selectedSubjects.push(subject);
            renderSelectedSubjects();
            subjectSelect.value = '';
        }

        function renderSelectedSubjects() {
            const container = document.getElementById('selectedSubjects');
            container.innerHTML = selectedSubjects.map((subject, index) => `
                <span class="inline-flex items-center gap-2 px-2.5 py-1 bg-indigo-50 text-indigo-800 rounded-lg text-xs font-medium">
                    ${escapeHtml(subject)}
                    <button type="button" data-index="${index}" class="text-indigo-600 hover:text-rose-600" aria-label="Remove ${escapeHtml(subject)}"><i class="fa-solid fa-xmark"></i></button>
                </span>
            `).join('');
            container.onclick = event => {
                const button = event.target.closest('button[data-index]');
                if (!button) return;
                selectedSubjects.splice(Number(button.dataset.index), 1);
                renderSelectedSubjects();
            };
        }

        window.saveSchedule = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editDocId').value;
            const name = document.getElementById('modalName').value.trim();
            const dateFrom = document.getElementById('modalDateFrom').value;
            const dateTo = document.getElementById('modalDateTo').value;
            if (dateFrom > dateTo) {
                showToast('The end date must be on or after the start date', 'error');
                return;
            }
            if (selectedSubjects.length === 0) {
                showToast('Add at least one subject', 'error');
                return;
            }

            if (!name) {
                showToast('Enter a name for the schedule', 'error');
                return;
            }

            const docId = editId ? editId : `sched_${crypto.randomUUID()}`;
            const payload = { id: docId, name, dateFrom, dateTo, subjects: [...selectedSubjects] };

            try {
                if (useLocalStorage) {
                    const index = scheduleData.findIndex(item => item.id === docId);
                    if (index === -1) scheduleData.push(payload);
                    else scheduleData[index] = payload;
                    saveLocalSchedules();
                    renderSchedule();
                } else {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', docId);
                    await setDoc(docRef, payload);
                }
                showToast('Schedule saved successfully', 'success');
                closeModal();
            } catch (err) {
                console.error("Save error:", err);
                showToast('Error saving to cloud', 'error');
            }
        }

        window.openSubjectModal = function() {
            document.getElementById('newSubjectName').value = '';
            document.getElementById('subjectModal').classList.remove('hidden');
            document.getElementById('newSubjectName').focus();
        }

        window.closeSubjectModal = function() {
            document.getElementById('subjectModal').classList.add('hidden');
        }

        window.saveSubject = async function(e) {
            e.preventDefault();
            const name = document.getElementById('newSubjectName').value.trim();
            if (!name) return;
            if ([...subjectData, ...scheduleData.flatMap(item => normalizeSchedule(item).subjects)]
                .some(subject => subject.toLocaleLowerCase() === name.toLocaleLowerCase())) {
                showToast('That subject already exists', 'error');
                return;
            }

            try {
                if (useLocalStorage) {
                    subjectData.push(name);
                    localStorage.setItem(subjectStorageKey, JSON.stringify(subjectData.filter(subject => !getDefaultSubjects().includes(subject))));
                } else {
                    const subjectId = `subject_${crypto.randomUUID()}`;
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'subjects', subjectId), { name });
                    subjectData.push(name);
                }
                updateSubjectOptions();
                document.getElementById('subjectSelect').value = name;
                closeSubjectModal();
                showToast('Subject added. Select it and press Add.', 'success');
            } catch (err) {
                console.error("Subject save error:", err);
                showToast('Error saving subject to cloud', 'error');
            }
        }

        window.deleteRecord = async function(id) {
            if (confirm('Are you sure you want to delete this schedule record?')) {
                try {
                    if (useLocalStorage) {
                        scheduleData = scheduleData.filter(item => item.id !== id);
                        saveLocalSchedules();
                        renderSchedule();
                    } else {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id));
                    }
                    showToast('Schedule deleted', 'success');
                } catch (err) {
                    console.error("Delete error:", err);
                    showToast('Error deleting record', 'error');
                }
            }
        }

        window.resetData = async function() {
            if (confirm('Are you sure you want to reset schedules to the defaults?')) {
                try {
                    if (useLocalStorage) {
                        scheduleData = [...defaultData];
                        saveLocalSchedules();
                        renderSchedule();
                    } else {
                        for (const item of defaultData) {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', item.id), item);
                        }
                    }
                    showToast('Schedules reset to default', 'success');
                } catch (err) {
                    console.error("Reset error:", err);
                    showToast('Error resetting data', 'error');
                }
            }
        }

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scheduleData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "schedule_data.json");
            dlAnchorElem.click();
            showToast('Schedule exported as JSON', 'success');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            if (type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
            } else {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-base";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(error => {
                    console.error('App install support could not be enabled:', error);
                });
            });
        }
    </script>
</body>
</html>
